<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style5.css">
</head>

<body>
    <div class="card">
        <img src="https://tse3.mm.bing.net/th?id=OIP.ZZ8bBuQQlkxbltfDca1xMwHaGI&pid=Api&P=0&h=180" alt="" class="logo" >
        <div class="card-content">
            <h1>Your Company</h1>
            <div>Tell us about your company. You will be able to invite your teamates in the next step</div>
        </div>
        <div class="form-content">
            <div>
                <label for="companyname" class="form-label">Company Name</label>
                <br>
                <input type="text" class="form-input">
            </div>
            <div>
                <label for="Industry" class="form-label">Industry(optional)</label>
                <br>
                <select name="" id="" class="form-input">
                    <option value="">Creative Agency</option>
                    <option value=""></option>
                </select>
            </div>
            <div>
                <label for="Industry" class="form-label">Your role(optional)</label> <br>
                <select name="" id="" class="form-input">
                    <option value="">Owner/ Founde/ CEO</option>
                    <option value=""></option>
                </select>
            </div>
            <div>
                <label for="Industry" class="form-label">Company size(optional)</label> <br>
                <select name="" id="" class="form-input">
                    <option value="">2-10</option>
                    <option value="">11-50</option>
                </select>
            </div>
        </div>
    </div>
</body>

</html>
