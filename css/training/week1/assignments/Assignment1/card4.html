<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style4.css">
</head>

<body>
    <div class="card">
        <img src="https://tse1.mm.bing.net/th?id=OIP.yh9g22Cv-Ond8vTpFJNKDQAAAA&pid=Api&P=0&h=180" alt="" class="logo">
        <div class="card-content">
            <h1>Card details</h1>
            <div>Enter your card details to kick-start your free trial. Don't worry, you won't be charged a dime until
                your free trial ends in <strong>7 days</strong>. </div>
        </div>
        <div class="flex-credit-card">
            <div class="flex-item-card">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor"
                    class="bi bi-credit-card" viewBox="0 0 16 16">
                    <path
                        d="M0 4a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2zm2-1a1 1 0 0 0-1 1v1h14V4a1 1 0 0 0-1-1zm13 4H1v5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1z" />
                    <path d="M2 10a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1v1a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1z" />
                </svg>
                <input type="text" class="input-card-number" placeholder="Card Number">
            </div>
            <div class="flex-item-date">
                <input type="text" class="input-short" placeholder="MM/YY">
            </div>
            <div class="flex-item-secret">
                <input type="text" class="input-short" placeholder="CVC">
            </div>
        </div>
        <button class="btn">Start your 7-day free trial</button>
        <div class="secure-encrypt"> 
            <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" fill="currentColor"
                class="bi bi-file-lock2" viewBox="0 0 16 16">
                <path
                    d="M8 5a1 1 0 0 1 1 1v1H7V6a1 1 0 0 1 1-1m2 2.076V6a2 2 0 1 0-4 0v1.076c-.54.166-1 .597-1 1.224v2.4c0 .816.781 1.3 1.5 1.3h3c.719 0 1.5-.484 1.5-1.3V8.3c0-.627-.46-1.058-1-1.224" />
                <path
                    d="M4 0a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2zm0 1h8a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1" />
            </svg>
            Secure and encrypted
        </div>
    </div>
</body>

</html>
